name: iOS TestFlight

on:
  push:
    branches: [feat/ios-2]
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Solo firmar IPA, no subir a TestFlight"
        type: boolean
        default: false

jobs:
  build-ios:
    name: Build, sign, upload TestFlight
    runs-on: macos-26
    timeout-minutes: 90

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || '83ALP6T57S' }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'WGTZ762S3W' }}
      SKIP_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_upload == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check App Store Connect secrets
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${APP_STORE_CONNECT_ISSUER_ID}" ]; then
            echo "Falta el secret APP_STORE_CONNECT_ISSUER_ID"
            echo "App Store Connect → Users and Access → Integrations → App Store Connect API → Issuer ID"
            missing=1
          fi
          if [ -z "${APP_STORE_CONNECT_PRIVATE_KEY}" ]; then
            echo "Falta el secret APP_STORE_CONNECT_PRIVATE_KEY (contenido del .p8)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Key ID: ${APP_STORE_CONNECT_KEY_ID}"
          echo "Team ID: ${APPLE_TEAM_ID}"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Flutter version
        run: |
          flutter --version
          xcodebuild -version

      - name: Use CocoaPods (disable SPM)
        run: flutter config --no-enable-swift-package-manager

      - name: Cache distribution certificates
        uses: actions/cache@v4
        with:
          path: ios/fastlane/certificates
          key: ios-distribution-cert-v1

      - name: Install Fastlane
        run: sudo gem install fastlane

      - name: Build signed IPA
        working-directory: ios
        run: |
          mkdir -p fastlane/certificates
          bundle_exec=fastlane
          $bundle_exec release

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: krimson-ios-appstore
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
