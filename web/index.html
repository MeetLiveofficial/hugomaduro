<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided by `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Meet&Live">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Meet&Live</title>
  <link rel="manifest" href="manifest.json">
  <style>html, body { margin: 0; background: #120E18; }</style>
  <script>
    // Fuerza la versión JS que FlutterFire espera.
    window.flutterfire_web_sdk_version = '12.15.0';
    // Evita que el navegador quede pegado a builds viejas.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((r) => r.unregister());
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
    }
  </script>
</head>
<body>
  <!-- Precarga Firebase en paralelo; Flutter arranca ya (sin overlay de texto). -->
  <script type="module">
    const bootFlutter = () => {
      if (window.__krimsonFlutterBooted) return;
      window.__krimsonFlutterBooted = true;
      const s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?v=' + Date.now();
      s.async = true;
      document.body.appendChild(s);
    };
    const preloadFirebase = async () => {
      try {
        const version = window.flutterfire_web_sdk_version || '12.15.0';
        const [firebase_core, firebase_auth, firebase_firestore, firebase_messaging] =
          await Promise.all([
            import(`https://www.gstatic.com/firebasejs/${version}/firebase-app.js`),
            import(`https://www.gstatic.com/firebasejs/${version}/firebase-auth.js`),
            import(`https://www.gstatic.com/firebasejs/${version}/firebase-firestore.js`),
            import(`https://www.gstatic.com/firebasejs/${version}/firebase-messaging.js`),
          ]);
        window.firebase_core = firebase_core;
        window.firebase_auth = firebase_auth;
        window.firebase_firestore = firebase_firestore;
        window.firebase_messaging = firebase_messaging;
        window.__krimsonFirebasePreloaded = true;
      } catch (e) {
        console.error('Firebase preload failed', e);
        window.__krimsonFirebasePreloaded = false;
      }
    };
    preloadFirebase();
    bootFlutter();
  </script>
</body>
</html>
